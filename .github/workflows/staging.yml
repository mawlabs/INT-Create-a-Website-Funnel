name: Staging deploy

# A demo copy for the team: the same build as production, but noindexed everywhere, and the copy gate is a
# warning rather than a blocker — the point of a demo is to look at work that is not finished yet.
# Needs the same SiteGround secrets as deploy.yml, pointed at a separate docroot (a subdomain, not the live site).

on:
  workflow_dispatch:
    inputs:
      docroot:
        description: 'SiteGround docroot, e.g. www/demo.monkeysat.work/public_html'
        required: true
      url:
        description: 'Public URL of the demo, e.g. https://demo.monkeysat.work'
        required: true
      site:
        description: 'Which site to deploy'
        required: true
        default: createawebsite-ca
        type: choice
        options: [createawebsite-ca, wphandyman-ca]
      hubspot:
        description: 'Connect HubSpot? Off by default, so a walkthrough leaves no test contacts in the CRM.'
        required: false
        default: false
        type: boolean

concurrency:
  group: staging-${{ inputs.docroot }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.site }} to ${{ inputs.url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Copy status (informational on staging)
        run: node scripts/check-copy.mjs --list

      - name: Build (noindexed)
        run: pnpm --filter ${{ inputs.site }} build
        env:
          PUBLIC_SITE_URL: ${{ inputs.url }}
          PUBLIC_NOINDEX: '1'
          PUBLIC_GA4_ID: ''
          # No analytics on a demo, and no CRM writes unless asked for. With HubSpot off the forms say plainly
          # that they are not connected instead of pretending to send.
          PUBLIC_HUBSPOT_PORTAL_ID: ${{ inputs.hubspot && vars.PUBLIC_HUBSPOT_PORTAL_ID || '' }}
          PUBLIC_HUBSPOT_FORM_EN: ${{ inputs.hubspot && vars.PUBLIC_HUBSPOT_FORM_EN || '' }}
          PUBLIC_HUBSPOT_FORM_FR: ${{ inputs.hubspot && vars.PUBLIC_HUBSPOT_FORM_FR || '' }}

      - name: Refuse to publish an indexable staging build
        run: |
          grep -q 'Disallow: /' "sites/${{ inputs.site }}/dist/robots.txt" || { echo 'robots.txt is not disallowing; refusing'; exit 1; }
          grep -q 'noindex' "sites/${{ inputs.site }}/dist/index.html" || { echo 'home page is missing noindex; refusing'; exit 1; }

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SG_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SG_PORT:-18765}" -H "${{ secrets.SG_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: rsync to SiteGround
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${SG_PORT:-18765}" \
            "sites/${{ inputs.site }}/dist/" \
            "${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}:~/${{ inputs.docroot }}/"

      - name: Check PHP is really running on that docroot
        run: |
          curl -s -o /tmp/audit.json -w 'HTTP %{http_code}\n' -X POST \
            -H 'Content-Type: application/json' -d '{"url":"http://127.0.0.1/"}' \
            "${{ inputs.url }}/api/audit.php" || true
          if grep -q 'url_private' /tmp/audit.json 2>/dev/null; then
            echo 'PHP is running: the endpoint answered and refused a private address, as it should.'
          else
            echo '::warning::The site check endpoint did not answer as expected. Enable PHP on this docroot, or the audit will not work.'
            head -c 300 /tmp/audit.json 2>/dev/null || true
          fi

      - name: Where it landed
        run: echo "Demo deployed to ${{ inputs.url }} — noindexed, and the site check needs PHP enabled on that docroot."
